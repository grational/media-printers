// [plugins] this block must be the first
plugins {
	// support for groovy
	id 'groovy'
	// support to api keyword
	id 'java-library'
	// awesome git tag / gradle version integration
	id 'pl.allegro.tech.build.axion-release' version '1.21.1'
	// to upload on a nexus server
	id 'maven-publish'
}

// [flavor] compatibility matrix
project.ext {
	toolchainVersion   = 17
	jvmVersion         = 17
	groovy             = [major: 4, minor: 0, patch: 30]
	groovyGroup        = groovy.major >= 4 ? 'apache' : 'codehaus'
	groovyVersion      = groovy.values().join('.')
	flavor             = "java-${jvmVersion}-groovy-${groovy.major}"
	spockVersion       = "2.4-groovy-${groovy.major}.${groovy.minor}"
	slf4jVersion       = '2.0.17'
}

scmVersion {
	repository {
		customUsername.set(
			providers.environmentVariable('MEDIA_PRINTERS_RELEASE_USERNAME')
				.orElse(providers.gradleProperty('release.customUsername'))
		)
		customPassword.set(
			providers.environmentVariable('MEDIA_PRINTERS_RELEASE_PASSWORD')
				.orElse(providers.gradleProperty('release.customPassword'))
		)
	}
}

project.with {
	//project.name is set in the settings.gradle with rootProject.name
	group       'it.grational'
	version     scmVersion.version // '0.5.0' (remove -SNAPSHOT for releases)
	description 'Provide and object the functionality to print itself on a media (currently csv,json)'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.toolchainVersion)
	}
	sourceCompatibility = JavaVersion.toVersion(project.jvmVersion)
	targetCompatibility = JavaVersion.toVersion(project.jvmVersion)
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	// Groovy language support
	api (
		"org.${groovyGroup}.groovy:groovy:$groovyVersion",
		"org.${groovyGroup}.groovy:groovy-json:$groovyVersion"
	)

	// We use the awesome Spock testing and specification framework
	testImplementation "org.spockframework:spock-core:$spockVersion"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

check {
	// clean before check
	dependsOn 'clean'
}

tasks.withType(Test) {
	useJUnitPlatform() 
	maxParallelForks = 2
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.jvmVersion) }
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'com.github.grational'
			artifactId = 'media-printers'
			version = scmVersion.version // '0.5.0' (remove -SNAPSHOT for releases)

			from components.java
		}
	}
}
